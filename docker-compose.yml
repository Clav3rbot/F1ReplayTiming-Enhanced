services:
  f1timing:
    build: .  # Uses root Dockerfile (unified FE+BE)
    ports:
      # Loopback only: put a TLS reverse proxy (Caddy, Tailscale Serve, ...)
      # in front. Docker publishes ports past the host firewall, so "8000:8000"
      # would expose the plain-HTTP API to the whole internet.
      - "127.0.0.1:${PORT:-8000}:8000"
    env_file: .env
    environment:
      # The container always listens on 8000 so reverse proxies have a stable
      # target. PORT sets the published host port only (overrides any PORT
      # in .env, which would otherwise move the port proxies point at).
      PORT: 8000
    volumes:
      - f1data:/data
      - f1cache:/data/fastf1-cache
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  f1data:
  f1cache:
